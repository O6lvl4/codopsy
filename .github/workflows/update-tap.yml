name: Update Homebrew Tap

# `release: published` alone never fires this workflow: the release is created by
# Release.yml using the default GITHUB_TOKEN, and GitHub does not trigger
# workflows from events raised by that token. `workflow_run` is what actually
# runs after a release build; `workflow_dispatch` is the manual fallback.
on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the tap (e.g. v2.2.0)
        required: true

jobs:
  update-tap:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve release tag
        id: release
        env:
          # For a tag push, workflow_run reports the tag in head_branch.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "${{ github.event_name }}" in
            release)           TAG="$RELEASE_TAG" ;;
            workflow_run)      TAG="$RUN_TAG" ;;
            workflow_dispatch) TAG="$INPUT_TAG" ;;
          esac
          case "$TAG" in
            v*) ;;
            *) echo "::error::'$TAG' is not a release tag; nothing to publish"; exit 1 ;;
          esac
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Require tap token
        run: |
          if [ -z "${{ secrets.TAP_TOKEN }}" ]; then
            echo "::error::TAP_TOKEN secret is not set; cannot push to O6lvl4/homebrew-tap"
            exit 1
          fi

      - name: Download release assets and compute SHAs
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          BASE="https://github.com/O6lvl4/codopsy/releases/download/${TAG}"

          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            # -f so a missing asset fails here instead of hashing an error page
            # into the formula and publishing a tap nobody can install from.
            curl -sfL "${BASE}/codopsy-${target}.tar.gz" -o "codopsy-${target}.tar.gz"
            SHA=$(sha256sum "codopsy-${target}.tar.gz" | cut -d' ' -f1)
            echo "SHA_${target//-/_}=${SHA}" >> $GITHUB_ENV
            echo "${target}: ${SHA}"
          done

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: O6lvl4/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"

          cat > tap/Formula/codopsy.rb << FORMULA
          class Codopsy < Formula
            desc "AST-level code quality analyzer for 35 languages with 182 lint rules"
            homepage "https://github.com/O6lvl4/codopsy"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/O6lvl4/codopsy/releases/download/${TAG}/codopsy-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_aarch64_apple_darwin}"
              end
              on_intel do
                url "https://github.com/O6lvl4/codopsy/releases/download/${TAG}/codopsy-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_x86_64_apple_darwin}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/O6lvl4/codopsy/releases/download/${TAG}/codopsy-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_x86_64_unknown_linux_gnu}"
              end
            end

            def install
              bin.install "codopsy"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/codopsy --version")
            end
          end
          FORMULA

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/codopsy.rb
          if git diff --cached --quiet; then
            echo "Formula already matches ${{ steps.release.outputs.tag }}; nothing to push"
            exit 0
          fi
          git commit -m "codopsy ${{ steps.release.outputs.version }}"
          git push
