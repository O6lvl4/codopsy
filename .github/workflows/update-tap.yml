name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT

      - name: Download release assets and compute SHAs
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          BASE="https://github.com/O6lvl4/codopsy/releases/download/${TAG}"

          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            curl -sL "${BASE}/codopsy-${target}.tar.gz" -o "codopsy-${target}.tar.gz"
            SHA=$(sha256sum "codopsy-${target}.tar.gz" | cut -d' ' -f1)
            echo "SHA_${target//-/_}=${SHA}" >> $GITHUB_ENV
            echo "${target}: ${SHA}"
          done

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: O6lvl4/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"

          cat > tap/Formula/codopsy.rb << FORMULA
          class Codopsy < Formula
            desc "AST-level code quality analyzer for 35 languages with 182 lint rules"
            homepage "https://github.com/O6lvl4/codopsy"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/O6lvl4/codopsy/releases/download/${TAG}/codopsy-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_aarch64_apple_darwin}"
              end
              on_intel do
                url "https://github.com/O6lvl4/codopsy/releases/download/${TAG}/codopsy-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_x86_64_apple_darwin}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/O6lvl4/codopsy/releases/download/${TAG}/codopsy-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_x86_64_unknown_linux_gnu}"
              end
            end

            def install
              bin.install "codopsy"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/codopsy --version")
            end
          end
          FORMULA

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/codopsy.rb
          git commit -m "codopsy ${{ steps.release.outputs.version }}"
          git push
